<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f211e" />
    <meta name="format-detection" content="telephone=no" />
    <title>品牌后台｜果壳铃手作铺</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar" aria-label="后台主导航">
        <a class="admin-brand" href="./index.html" aria-label="返回前台店铺">品牌后台</a>
        <nav class="admin-nav" id="adminNav"></nav>
      </aside>

      <main class="admin-main">

            <p id="adminCrumb">数据看板</p>
            <h1 id="adminTitle">数据看板</h1>
          </div>
          <div class="header-actions">
            <label class="search-box" aria-label="搜索">

            <span class="backend-status" id="backendStatus">连接中</span>
            <a class="shop-link" href="./index.html">查看前台</a>
            <button class="avatar-button" type="button" aria-label="账号"></button>
          </div>
        </header>

        <section class="admin-content" id="adminContent" aria-live="polite"></section>
      </main>
    </div>

    <div class="admin-toast" id="adminToast" role="status"></div>
    <script src="./admin.js"></script>
